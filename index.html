      b.appendChild(miEl('fingerprint'));b.appendChild(document.createTextNode(ab?'指紋・顔認証で解除':'パスキー（指紋・顔認証）で解除'));
      b.onclick=()=>{b.disabled=true;brBiometricUnlock(done).finally(()=>{b.disabled=false})};
      const inp=sh.querySelector('.sec-in')||sh.querySelector('input');
      if(inp&&inp.parentNode)inp.parentNode.insertBefore(b,inp);else sh.appendChild(b);
      if(!sh.classList.contains('on'))return;
      /* iOS Safari rejects credentials.get() when it is launched by this timer
         instead of a direct user gesture. Keep the WebAuthn button enabled and
         start the request only from b.onclick. Preserve Android's native prompt. */
      if(ab){
        b.disabled=true;
        brBiometricUnlock(done,false).finally(()=>{b.disabled=false});
      }
    },50);
  };
  const oldSecSettingsBox=secSettingsBox;
  secSettingsBox=function(refresh){
    const g=oldSecSettingsBox(refresh),ab=window.AndroidBridge;
    const desc=g.querySelector('.ds-desc');
    if(desc)desc.textContent='本やフォルダを非表示にし、書籍本体をAES-GCMで暗号化して保存します。パスコードを入力したときだけ復号して表示します。タイトルなどの本棚情報はアプリ内に残ります。';
    g.appendChild(mkEl('h4','生体認証（指紋・顔認証）','ds-h'));
    g.appendChild(mkEl('p','指紋認証や顔認証（クラス2対応を含む）を使ってロックを解除します。','ds-desc'));
    const act=(label,sub,fn)=>{const b=mkEl('button','','ds-act');b.appendChild(miEl('fingerprint'));const t=mkEl('span');t.appendChild(mkEl('b',label));if(sub)t.appendChild(mkEl('small',sub));b.appendChild(t);b.appendChild(miEl('chevron_right','ds-go'));b.onclick=fn;g.appendChild(b)};
    try{
      if(!ab&&!brWebBioSupported()){
        g.appendChild(mkEl('p',window.isSecureContext?'※ このブラウザではパスキー（WebAuthn）を利用できません。':'※ ローカルファイル直開き（file://）ではWeb生体認証は利用できません。GitHub Pages などの https:// または http://localhost から開くとパスキー（指紋・顔認証）が利用できます。','note'));
      }else if(ab&&typeof ab.biometricAvailable==='function'&&!ab.biometricAvailable()){
        g.appendChild(mkEl('p','※ この端末では生体認証を利用できないか、端末に生体認証が登録されていません。','note'));
      }else if(!secHas()){
        g.appendChild(mkEl('p','※ 生体認証を利用するには、まず上の「パスコードを設定」からパスコードを作成してください。','note'));
      }else if(brHasBioUnlock()){
        act(ab?'生体認証で解除をテスト':'パスキー生体認証で解除をテスト','登録済みの指紋・顔認証の動作を確認します',async()=>{try{await brBiometricUnlock()}catch(e){toast(e.message||'生体認証テストに失敗しました')}});
        if(brMasterBytes)act(ab?'生体認証を再設定':'パスキー生体認証を再設定','指紋・顔認証キーを更新します',async()=>{try{await brEnableBiometric();if(refresh)refresh()}catch(e){toast(e.message||'生体認証を再設定できませんでした')}});
        act(ab?'生体認証を無効化':'パスキー生体認証を無効化',ab?'Android Keystore に保存した生体認証キーを削除します':'ブラウザに保存したパスキー連携キーを削除します',()=>{brDisableBiometric();toast('生体認証を無効にしました');if(refresh)refresh()});
      }else if(brMasterBytes){
        act(ab?'生体認証（指紋・顔認証）を設定':'パスキー（指紋・顔認証）を設定',ab?'指紋や顔認証で解除できるように登録します':'WebAuthn パスキー（PRF拡張）で解除できるように登録します',async()=>{try{await brEnableBiometric();if(refresh)refresh()}catch(e){toast(e.message||'生体認証を設定できませんでした')}});
      }else{
        g.appendChild(mkEl('p','※ 生体認証を設定するには、先にパスコードを入力して一度ロックを解除してください。','note'));
      }
    }catch(e){applog('security','生体認証の状態確認に失敗：'+(e.message||e),'w')}
    return g;
  };
  /* V5.2.5：アプリ全体のロック画面から生体認証を使えるようにする（以前はこの関数の外から見えず、ボタンが出なかった）。
     アプリのロックの解除では、暗号化フォルダー・非表示の本のロックは解除しない */
  window.brAppBio={
    available(){try{return brBioAvailable()&&brHasBioUnlock()}catch(_){return false}},
    native(){try{return brHasNativeBio()}catch(_){return false}},
    async unlock(){
      if(brBioBusy)throw new Error('生体認証の処理中です');
      brBioBusy=true;window.__brBioBusy=true;
      try{
        const keyBytes=brHasNativeBio()
          ?(await(async()=>{const r=await brBioRequest('unlockBookKey',[]);if(!r.ok)throw new Error(r.message);return brUnB64(r.key)})())
          :(await brWebBiometricUnlock());
        if(!keyBytes||keyBytes.length!==32)throw new Error('暗号鍵を取得できませんでした');
        if(typeof secOpen!=='undefined'&&secOpen)await brSetMaster(keyBytes); /* 非表示の本を表示中なら鍵を入れ直す。ロック中なら鍵は持たない */
        keyBytes.fill&&keyBytes.fill(0);
        return true;
      }finally{brFinishBioBusy()}
    }
  };
  if(secHas()&&LS.get('rd:appLock',false)){
    try{document.body.classList.add('app-locked')}catch(_){} /* 起動直後から中身を見せない */
    setTimeout(()=>appLockNow('アプリ起動',true),80);
  }
  applog('security','V5.3.7：ロック書籍のAES-GCM暗号化とAndroid生体認証連携を初期化');
})();

/* V5.2.4: アプリ全体の自動ロックを暗号化フォルダーの自動ロックから独立
   V5.2.5 修正：
   ・ロック中は、画面全体を不透明の面で覆う。以前は本棚などを見えなくしていただけで、
     本文の入れ物（#fr）は表示の指定が直接書かれているため隠れず、前に読んでいた本の文字が後ろに見えていた
     （本が開いたように見えたのはこれ。実際には本は開いていない）
   ・生体認証のボタンを出し、Androidでは開いたときに指紋・顔認証の画面を自動で出す
   ・「キャンセル」や「戻る」でシートを閉じても、画面をタップすればまたロック解除の画面を出す
   ・ロック中は自動スキャン（本の自動取り込み）をしない */
let _appLocked=false,_appLockHideAt=0,_appLockLastAct=Date.now(),_appLockPrompt=false,_appLockBioAt=0;
function appLockRelease(){
  _appLocked=false;_appLockHideAt=0;_appLockLastAct=Date.now();_appLockPrompt=false;
  document.body.classList.remove('app-locked');
  if(typeof closeAll==='function')closeAll();
}
function appLockNow(reason,force){
  if(!LS.get('rd:appLock',false)||!secHas())return;
  if(_appLocked&&!force)return;
  _appLocked=true;document.body.classList.add('app-locked');
  try{if(typeof SHEET!=='undefined'&&SHEET.stack)SHEET.stack.length=0}catch(_){}
  try{if(typeof bookPopClose==='function')bookPopClose()}catch(_){}
  try{if(typeof closeAll==='function')closeAll()}catch(_){}
  applog('security','アプリをロック（'+(reason||'自動')+'）');
  if(document.visibilityState!=='hidden')setTimeout(()=>appLockSheet(),80);
}
function appLockBio(sh,msg,btn,auto){
  const B=window.brAppBio;if(!B||!B.available())return;
  if(btn.disabled)return;btn.disabled=true;if(msg)msg.textContent='';
  _appLockBioAt=Date.now();
  B.unlock().then(()=>{appLockRelease();applog('security',(B.native()?'生体認証':'パスキー')+'でアプリロックを解除');toast('アプリのロックを解除しました')})
   .catch(e=>{btn.disabled=false;if(msg&&!(auto&&/キャンセル|cancel/i.test(String(e&&e.message))))msg.textContent=e&&e.message?e.message:'生体認証に失敗しました'});
}
function appLockSheet(){
  if(!_appLocked)return;
  const sh0=$('#sheet');if(sh0&&sh0.classList.contains('on')&&sh0.querySelector('.app-lock-in'))return;
  try{if(typeof SHEET!=='undefined'&&SHEET.stack)SHEET.stack.length=0}catch(_){}
  _appLockPrompt=true;
  secSheet('アプリをロックしています','アプリ全体のロックです。解除しても暗号化フォルダーのロック状態は変わりません。',(sh,msg,ok)=>{
    sh.classList.add('app-lock-sheet');
    ok.textContent='アプリのロックを解除';
    const inp=secInput('パスコード');inp.classList.add('app-lock-in');
    const B=window.brAppBio,bioOn=!!(B&&B.available());
    let bio=null;
    if(bioOn){
      bio=document.createElement('button');bio.type='button';bio.id='brAppBio';bio.className='m3-btn-tonal br-bio-unlock';
      bio.appendChild(miEl('fingerprint'));bio.appendChild(document.createTextNode(B.native()?'指紋・顔認証で解除':'パスキー（指紋・顔認証）で解除'));
      bio.setAttribute('aria-label',B.native()?'生体認証でアプリロックを解除':'パスキーでアプリロックを解除');
      bio.onclick=()=>appLockBio(sh,msg,bio,false);
      sh.appendChild(bio);
    }
    sh.appendChild(inp);
    const go=async()=>{
      if(ok.disabled)return;ok.disabled=true;ok.dataset.busy='1';msg.textContent='';
      const r=await secVerify(inp.value);ok.dataset.busy='';
      if(r.ok){appLockRelease();applog('security','アプリロックを解除');toast('アプリのロックを解除しました');}
      else{msg.textContent=r.msg;inp.value='';ok.disabled=!!r.wait;if(!r.wait)inp.focus();else setTimeout(()=>{ok.disabled=false},Math.max(1000,((secGet()||{}).u||0)-Date.now()))}
    };
    ok.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
    return{focus:bioOn?null:inp,after:()=>{
      /* Androidは、開いたときに指紋・顔認証の画面を自動で出す（ブラウザのパスキーはタップが必要なのでボタンだけ） */
      if(bio&&B.native()&&Date.now()-_appLockBioAt>1500)setTimeout(()=>{if(_appLocked&&document.visibilityState==='visible'&&bio.isConnected)appLockBio(sh,msg,bio,true)},300);
    }};
  });
}
/* ロック中にシートが閉じられたら、画面のタップでまた解除の画面を出す */
document.addEventListener('click',ev=>{
  if(!_appLocked)return;const sh=$('#sheet');
  if(sh&&sh.classList.contains('on'))return;
  ev.preventDefault();ev.stopPropagation();appLockSheet();
},true);
function appLockBgDelay(){const n=LS.get('rd:appLockBg',0);return typeof n==='number'?n:0}
function appLockIdleDelay(){const n=LS.get('rd:appLockIdle',-1);return typeof n==='number'?n:-1}
function appLockOnLeave(){
  if(!LS.get('rd:appLock',false)||!secHas())return;
  _appLockHideAt=Date.now();const d=appLockBgDelay();
  if(window.__brBioBusy)return;
  if(d===0)appLockNow('バックグラウンド移行');
}
function appLockOnReturn(){
  if(window.__brBioBusy)return;
  if(!LS.get('rd:appLock',false)||!secHas()){_appLockHideAt=0;return}
  const d=appLockBgDelay(),now=Date.now();
  if(d>=0&&_appLockHideAt&&now-_appLockHideAt>=d*1000){appLockNow('バックグラウンドから復帰');}
  else if(_appLocked)setTimeout(()=>appLockSheet(),120); /* 離れたときにロックした場合：戻ったら解除の画面を出す */
  _appLockHideAt=0;_appLockLastAct=now;
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')appLockOnLeave();else appLockOnReturn();
});
addEventListener('pagehide',appLockOnLeave);
addEventListener('pageshow',appLockOnReturn);
['pointerdown','keydown','touchstart'].forEach(n=>addEventListener(n,()=>{_appLockLastAct=Date.now()},{capture:true,passive:true}));
setInterval(()=>{
  if(window.__brBioBusy||document.hidden||_appLocked||!LS.get('rd:appLock',false)||!secHas())return;
  const d=appLockIdleDelay();
  if(d>0&&Date.now()-_appLockLastAct>=d*1000)appLockNow('操作のない時間');
},3000);
</script>
</body>
</html>
